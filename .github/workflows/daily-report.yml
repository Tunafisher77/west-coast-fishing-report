name: Daily West Coast Fishing Report

on:
  workflow_dispatch:
  schedule:
    # Covers 6 AM Pacific in both daylight and standard time.
    - cron: "5 13,14 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce 6 AM Pacific schedule
        if: github.event_name == 'schedule'
        run: test "$(TZ=America/Los_Angeles date +%H)" = "06"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Build report
        run: |
          REPORT_DAY="$(TZ=America/Los_Angeles date +%F)"
          python -m wcfr.main --date "$REPORT_DAY" --output "archive/$REPORT_DAY"
      - name: Send through Google Apps Script
        env:
          APPS_SCRIPT_WEB_APP_URL: ${{ secrets.APPS_SCRIPT_WEB_APP_URL }}
          FISHING_WEBHOOK_TOKEN: ${{ secrets.FISHING_WEBHOOK_TOKEN }}
        run: |
          REPORT_DAY="$(TZ=America/Los_Angeles date +%F)"
          if [ -n "$APPS_SCRIPT_WEB_APP_URL" ] && [ -n "$FISHING_WEBHOOK_TOKEN" ]; then
            python scripts/send_to_apps_script.py               --report "archive/$REPORT_DAY/email.html"               --subject "West Coast Fishing Brief — $REPORT_DAY"
          else
            echo "Apps Script secrets not configured; report remains available as an artifact."
          fi
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet || git commit -m "Archive fishing report $(TZ=America/Los_Angeles date +%F)"
          git push
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: west-coast-fishing-report
          path: archive/
          retention-days: 30
